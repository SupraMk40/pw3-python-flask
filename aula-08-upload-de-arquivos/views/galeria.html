{% extends 'base.html' %}
{% block content %}

<h2 style="text-align: center;">Galeria</h2><br>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{ category }}">
{{ message }}
</div>
{% endfor %}
{% endwith %}

<div class="container col-6">
    <div class="card mt-4">
        <div class="card body">
            <form action="{{url_for('galeria')}}" method="POST" enctype="multipart/form-data">
                <label>Envie uma imagem frente e verso do seu cartao:</label>
                <input type="file" name="file" class="form-control" required><br>
                <button type="submit" class="btn btn-danger btn-block">Fazer Upload</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
