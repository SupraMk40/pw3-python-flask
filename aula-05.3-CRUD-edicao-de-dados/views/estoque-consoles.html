{% extends 'base.html' %}
{% block content %}

<!-- FORMULARIO DE CADASTRO -->
 <details>
    <summary>Cadrastrar um novo Cunsoli</summary>
    <div class="col-md-4">
        <form action="{{url_for('estoque_jogos')}}" method="POST">
            <input type="text" name="nome" placeholder="Nome" class="form-control" required>
            <input type="text" name="fabricante" placeholder="Fabricante" class="form-control" required>
            <input type="text" name="ano" placeholder="Ano" class="form-control" required>
            <input type="number" name="preco" placeholder="Preço" class="form-control" required>
            <input type="number" name="quantidade" placeholder="Quantidade" class="form-control" required>
        <br>
        <input type="submit" value="Cadastrar" class="btn btn-success">
        <input type="reset" value="Limpar" class="btn btn-danger">
        </form>
    </div>
 </details>
<hr>

<h2>Controle de Estoque</h2>
<table class="table table-bordered table-hover">
    <thead class="table-dark">
        <tr>
            <th>Nome</th>
            <th>Fabricante</th>
            <th>Ano</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th colspan="2" style="text-align: center;">Ações</th> 
        </tr>
    </thead>
    <tbody>
        {% for game in games%}
        <tr>
            <td>{{game.nome}}</td>
            <td>{{game.fabricante}}</td>
            <td>{{game.ano}}</td>
            <td>{{game.preco}}</td>
            <td>{{game.quantidade}}</td>
            <td>
                <a href="{{url_for('editar_jogos', id=game.id)}}" class="btn btn-warning">
                Editar
                </a>
            </td>
            <td>
                <a href="{{url_for('estoque_jogos', id=game.id)}}" class="btn btn-danger" onclick="return confirm('Deseja mesmo desadicionar o jogo?')">
                Deletar
            </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock content%}
